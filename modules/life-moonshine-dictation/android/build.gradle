plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'life.dashboard'
version = '1.0.0'

android {
  namespace "expo.modules.moonshinedictation"
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'ai.moonshine:moonshine-voice:0.1.1'
}
