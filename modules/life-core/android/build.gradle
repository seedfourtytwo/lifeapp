plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'life.dashboard'
version = '1.0.0'

android {
  namespace "expo.modules.lifecore"
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is stubs only; the real one runs the JSON code on the JVM.
  testImplementation 'org.json:json:20240303'
}
