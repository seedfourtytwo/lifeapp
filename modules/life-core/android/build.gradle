plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'life.dashboard'
version = '1.0.0'

android {
  namespace "expo.modules.lifecore"
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core:1.15.0'
  // The same Media3 as expo-audio, so the app carries one copy.
  implementation 'androidx.media3:media3-exoplayer:1.8.0'
  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is stubs only; the real one runs the JSON code on the JVM.
  testImplementation 'org.json:json:20240303'
}
